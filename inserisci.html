<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Sconto Click Libri – Crea link sinossi</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;background:#fff;color:#222;font-family:Arial,sans-serif}
main{max-width:680px;margin:0 auto}
h1{font-size:23px;margin:0 0 8px}
p{color:#555;line-height:1.5}
input,textarea{display:block;width:100%;padding:14px;border:2px solid #f58220;border-radius:10px;font:16px Arial,sans-serif;margin:0 0 12px}
textarea{min-height:280px;line-height:1.6;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
button{border:0;border-radius:9px;padding:13px 17px;font-size:15px;font-weight:700;cursor:pointer;background:#f58220;color:#fff}
button.secondary{background:#eee;color:#222}
#result{display:none;margin-top:18px;padding:14px;border:1px solid #eee;border-radius:10px;background:#fffaf5}
#shareLink{font-size:14px;overflow-wrap:anywhere;color:#a64c00}
#status{min-height:24px;margin-top:12px;color:#287a39;font-size:14px}
</style>
</head>
<body>
<main>
<h1>📚 Crea il link della panoramica</h1>
<p>Inserisci il titolo e incolla la sinossi. La pagina creerà un link pronto da copiare e aggiungere al testo del post Telegram.</p>
<input id="bookTitle" type="text" placeholder="Titolo del libro (facoltativo)">
<textarea id="synopsis" placeholder="TOCCA QUI E INCOLLA LA SINOSSI DEL LIBRO"></textarea>
<div class="actions">
<button id="paste">📋 Incolla</button>
<button id="generate">🔗 Genera link sinossi</button>
</div>
<section id="result">
<strong>Link pronto per Telegram</strong>
<p id="shareLink"></p>
<div class="actions">
<button id="copyLink">📋 Copia link</button>
<button id="openLink" class="secondary">Apri anteprima</button>
</div>
</section>
<div id="status" role="status"></div>
</main>
<script>
const area=document.getElementById("synopsis");
const title=document.getElementById("bookTitle");
const status=document.getElementById("status");
const result=document.getElementById("result");
let generatedUrl="";
const ARCHIVE_URL="https://script.google.com/macros/s/AKfycbxNMWgsnHNybD0HyrTgGVF81XWuWRqR12ZWk2lVTJ63WBJvBPB2dvEkrso1snOsXtNsoQ/exec";
function createShortId(){
 if(window.crypto && crypto.randomUUID){
  return crypto.randomUUID().replace(/-/g,"").substring(0,8).toUpperCase();
 }
 return Math.random().toString(16).substring(2,10).toUpperCase();
}
try{area.value=localStorage.getItem("scontoClickSinossiBozza")||"";title.value=localStorage.getItem("scontoClickTitoloBozza")||"";}catch(e){}
function encodeText(value){
 const bytes=new TextEncoder().encode(value);
 let binary="";
 for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);
 return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
document.getElementById("paste").addEventListener("click",async()=>{
 try{area.value=await navigator.clipboard.readText();status.textContent="Sinossi incollata.";}
 catch(e){status.textContent="Tocca il riquadro della sinossi e usa Incolla.";}
});
document.getElementById("generate").addEventListener("click",()=>{
 const synopsis=area.value.trim();
 if(!synopsis){status.textContent="Incolla prima la sinossi.";return;}
 if(new TextEncoder().encode(synopsis).length>8000){status.textContent="La sinossi è troppo lunga: riducila a meno di 8 KB.";return;}
 try{localStorage.setItem("scontoClickSinossiBozza",synopsis);localStorage.setItem("scontoClickTitoloBozza",title.value.trim());}catch(e){}
 const id=createShortId();
 generatedUrl=new URL("s/?id="+encodeURIComponent(id),location.href).href;
 document.getElementById("shareLink").textContent=generatedUrl;
 result.style.display="block";
 status.textContent="Link creato. Salvataggio della sinossi in corso...";
 let frame=document.getElementById("sclSubmitFrame");
 if(!frame){frame=document.createElement("iframe");frame.name="sclSubmitFrame";frame.id="sclSubmitFrame";frame.style.display="none";document.body.appendChild(frame);}
 let form=document.getElementById("sclSubmitForm");
 if(form)form.remove();
 form=document.createElement("form");form.id="sclSubmitForm";form.method="POST";form.action=ARCHIVE_URL;form.target="sclSubmitFrame";
 const fields={id:id,t:title.value.trim(),s:synopsis};
 Object.entries(fields).forEach(([name,value])=>{const input=document.createElement("input");input.type="hidden";input.name=name;input.value=value;form.appendChild(input);});
 document.body.appendChild(form);
 form.submit();
 status.textContent="Link pronto. La sinossi viene salvata: attendi qualche secondo prima di usarlo.";
});

document.getElementById("copyLink").addEventListener("click",async()=>{
 if(!generatedUrl)return;
 try{await navigator.clipboard.writeText(generatedUrl);status.textContent="Link copiato! Incollalo nel campo URL di “Crea link” su Telegram.";}
 catch(e){status.textContent="Seleziona il link qui sopra e copialo con Ctrl+C.";}
});
document.getElementById("openLink").addEventListener("click",()=>{
 if(generatedUrl)window.open(generatedUrl,"_blank","noopener");
});
</script>
</body>
</html>
