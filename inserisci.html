<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Sconto Click Libri – Inserisci panoramica</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;background:#fff;color:#222;font-family:Arial,sans-serif}
main{max-width:680px;margin:0 auto}
h1{font-size:23px;margin:0 0 8px}
p{color:#555;line-height:1.5}
textarea{display:block;width:100%;min-height:320px;padding:14px;border:2px solid #f58220;border-radius:10px;font:16px/1.6 Arial,sans-serif;resize:vertical;background:#fff}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
button{border:0;border-radius:9px;padding:13px 17px;font-size:15px;font-weight:700;cursor:pointer;background:#f58220;color:#fff}
button.secondary{background:#eee;color:#222}
#status{min-height:24px;margin-top:12px;color:#287a39;font-size:14px}
</style>
</head>
<body>
<main>
<h1>📚 Inserisci la panoramica</h1>
<p>Incolla la sinossi del libro. Se vuoi, aggiungi il link Amazon: ricaveremo automaticamente il codice del libro.</p>
<input id="amazonLink" type="url" placeholder="Link Amazon del libro (facoltativo)" autocomplete="url" style="display:block;width:100%;padding:13px;margin:0 0 12px;border:2px solid #f58220;border-radius:10px;font:16px Arial,sans-serif">
<textarea id="synopsis" placeholder="TOCCA QUI E INCOLLA LA SINOSSI DEL LIBRO"></textarea>
<div class="actions">
<button id="paste">📋 Incolla</button>
<button id="save">💾 Salva bozza</button>
<button id="send">📨 Prepara invio al bot</button>
<button id="copy" class="secondary">Copia testo</button>
</div>
<div id="status" role="status"></div>
</main>
<script>
const area=document.getElementById("synopsis");
const amazonLink=document.getElementById("amazonLink");
const status=document.getElementById("status");
try{area.value=localStorage.getItem("scontoClickSinossiBozza")||"";amazonLink.value=localStorage.getItem("scontoClickLinkAmazon")||"";}catch(e){}
function getAsin(value){
 try{
  const url=new URL(value.trim());
  if(!/(^|\\.)amazon\\./i.test(url.hostname))return "";
  const match=url.pathname.match(/\\/(?:dp|gp\\/product|gp\\/aw\\/d|product)\\/([A-Z0-9]{10})(?:[/?]|$)/i);
  return match?match[1].toUpperCase():"";
 }catch(e){return "";}
}
document.getElementById("paste").addEventListener("click",async()=>{
 try{area.value=await navigator.clipboard.readText();status.textContent="Sinossi incollata.";}
 catch(e){status.textContent="Tocca il riquadro della sinossi e usa Incolla.";}
});
document.getElementById("save").addEventListener("click",()=>{
 if(!area.value.trim()){status.textContent="Incolla prima la sinossi.";return;}
 try{localStorage.setItem("scontoClickSinossiBozza",area.value.trim());localStorage.setItem("scontoClickLinkAmazon",amazonLink.value.trim());status.textContent="Bozza salvata su questo dispositivo.";}
 catch(e){status.textContent="Salvataggio non disponibile nel browser.";}
});
document.getElementById("send").addEventListener("click",async()=>{
 const synopsis=area.value.trim();
 const link=amazonLink.value.trim();
 const code=getAsin(link);
 if(!synopsis){status.textContent="Incolla prima la sinossi.";return;}
 if(!link){status.textContent="Per associare la sinossi al libro, incolla il suo link Amazon.";return;}
 if(!code){status.textContent="Non riesco a leggere l'ASIN da questo link. Usa il link completo Amazon con /dp/ seguito dal codice del libro.";return;}
 const command="/sinossi "+code+"\\n"+synopsis;
 const botWindow=window.open("https://t.me/Sconto_Click_bot","_blank");
 try{await navigator.clipboard.writeText(command);status.textContent="Comando copiato. Nel bot Telegram incollalo e invialo.";
  if(!botWindow)status.textContent+=" Se non si è aperto, consenti i popup o apri @Sconto_Click_bot.";
 }catch(e){area.value=command;area.select();status.textContent="Copia il comando selezionato con Ctrl+C, poi apri @Sconto_Click_bot e invialo.";
  if(!botWindow)status.textContent+=" Apri @Sconto_Click_bot manualmente.";
 }
});
document.getElementById("copy").addEventListener("click",async()=>{
 if(!area.value.trim()){status.textContent="Non c'è testo da copiare.";return;}
 try{await navigator.clipboard.writeText(area.value);status.textContent="Testo copiato.";}
 catch(e){area.select();status.textContent="Testo selezionato: usa Ctrl+C per copiarlo.";}
});
</script>
</body>
</html>
