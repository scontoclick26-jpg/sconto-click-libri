<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>📖 Panoramica – ScontoLibri</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#fff7ef}
#message{padding:28px 20px;color:#555;line-height:1.6}
iframe{display:none;border:0;width:100%;height:100%;min-height:100vh}
</style>
</head>
<body>
<div id="message">Caricamento della panoramica ScontoLibri...</div>
<iframe id="viewer" title="Panoramica del libro"></iframe>
<script>
(function(){
 const ARCHIVE="https://script.google.com/macros/s/AKfycbzAcUGZUXXgwVitXv79bRrYlSm2gkn3ska_JtK122wI0XsuyUYY5E5qHGflU23ya21rvw/exec";
 const id=new URLSearchParams(location.search).get("id");
 const frame=document.getElementById("viewer");
 const message=document.getElementById("message");
 if(id&&/^[A-F0-9]{8}$/i.test(id)){
   frame.src=ARCHIVE+"?id="+encodeURIComponent(id.toUpperCase());
   frame.style.display="block";
   message.style.display="none";
   return;
 }
 try{
   const match=location.hash.match(/(?:^#|&)d=([^&]*)/);
   if(!match)throw new Error("missing");
   let encoded=match[1].replace(/-/g,"+").replace(/_/g,"/");
   while(encoded.length%4)encoded+="=";
   const binary=atob(encoded);
   const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
   const data=JSON.parse(new TextDecoder().decode(bytes));
   if(!data.s||!String(data.s).trim())throw new Error("empty");
   document.title="📖 "+(data.t||"Panoramica del libro")+" – ScontoLibri";
   message.innerHTML="<main style='max-width:720px;margin:24px auto;background:white;border:2px solid #f58220;border-radius:16px;padding:24px'><strong style='color:#f58220'>📚 SCONTOLIBRI</strong><h2 id='bookTitle'></h2><div id='bookText' style='font-size:17px;line-height:1.75;white-space:pre-wrap'></div><footer style='margin-top:24px;color:#888;text-align:center'>Una lettura consigliata da ScontoLibri</footer></main>";
   document.getElementById("bookTitle").textContent="📖 "+(data.t||"Panoramica del libro");
   document.getElementById("bookText").textContent=data.s;
 }catch(e){message.textContent="Panoramica non disponibile. Chiedi nuovamente il link a ScontoLibri.";}
})();
</script>
</body>
</html>
