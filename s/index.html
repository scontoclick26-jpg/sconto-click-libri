<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>📖 Panoramica – ScontoClick</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#fff7ef}
#message{padding:28px 20px;color:#555;line-height:1.6}
iframe{display:none;border:0;width:100%;height:100%;min-height:100vh}
#closeButton{position:fixed;top:12px;right:12px;z-index:10;border:0;border-radius:22px;padding:11px 16px;background:#f58220;color:#fff;font-size:15px;font-weight:700;box-shadow:0 2px 8px #0003;cursor:pointer}
</style>
</head>
<body>
<button id="closeButton" type="button" onclick="closePanoramica()">✖ Chiudi</button>
<div id="message">Caricamento della panoramica ScontoClick...</div>
<iframe id="viewer" title="Panoramica del libro"></iframe>
<script>
function closePanoramica(){
 try{
   if(window.Telegram&&window.Telegram.WebApp&&typeof window.Telegram.WebApp.close==="function"){
     window.Telegram.WebApp.close();
     return;
   }
 }catch(e){}
 if(window.history.length>1){
   window.history.back();
 }else{
   window.location.href="https://t.me/sconto_click";
 }
}
(function(){
 const ARCHIVE="https://script.google.com/macros/s/AKfycbxNMWgsnHNybD0HyrTgGVF81XWuWRqR12ZWk2lVTJ63WBJvBPB2dvEkrso1snOsXtNsoQ/exec";
 const id=new URLSearchParams(location.search).get("id");
 const frame=document.getElementById("viewer");
 const message=document.getElementById("message");
 if(id&&/^[A-F0-9]{8}$/i.test(id)){
   frame.src=ARCHIVE+"?id="+encodeURIComponent(id.toUpperCase());
   frame.style.display="block";
   message.style.display="none";
   return;
 }
 try{
   const match=location.hash.match(/(?:^#|&)d=([^&]*)/);
   if(!match)throw new Error("missing");
   let encoded=match[1].replace(/-/g,"+").replace(/_/g,"/");
   while(encoded.length%4)encoded+="=";
   const binary=atob(encoded);
   const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
   const data=JSON.parse(new TextDecoder().decode(bytes));
   if(!data.s||!String(data.s).trim())throw new Error("empty");
   document.title="📖 "+(data.t||"Panoramica del libro")+" – ScontoClick";
   message.innerHTML="<main style='max-width:720px;margin:24px auto;background:white;border:2px solid #f58220;border-radius:16px;padding:24px'><strong style='color:#f58220'>📚 ScontoClick</strong><h2 id='bookTitle'></h2><div id='bookText' style='font-size:17px;line-height:1.75;white-space:pre-wrap'></div><footer style='margin-top:24px;color:#888;text-align:center'>✨ Consigliato da ScontoClick!</footer></main>";
   document.getElementById("bookTitle").textContent="📖 "+(data.t||"Panoramica del libro");
   document.getElementById("bookText").textContent=data.s;
 }catch(e){message.textContent="Panoramica non disponibile. Chiedi nuovamente il link a ScontoClick.";}
})();
</script>
</body>
</html>
