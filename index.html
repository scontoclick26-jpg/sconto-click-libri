<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Panoramica</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#fff;color:#222;font-family:Arial,sans-serif}
main{max-width:680px;margin:0 auto}
#description{font-size:17px;line-height:1.75;white-space:pre-line;overflow-wrap:anywhere}
</style>
</head>
<body>
<main><div id="description">Caricamento...</div></main>
<script>
const p=new URLSearchParams(location.search);
const direct=(p.get("panoramica")||"").trim();
const isbn=(p.get("isbn")||"").trim().replace(/[- ]/g,"");
const asin=(p.get("asin")||"").trim();
const amazon=p.get("url")||"";
const output=document.getElementById("description");

async function loadPanoramica(){
 if(direct){output.textContent=direct;return;}
 const codes=[];
 if(isbn)codes.push(isbn);
 if(asin)codes.push(asin);
 if(amazon){
  try{
   const u=new URL(amazon);
   const m=u.pathname.match(/\/(?:dp|gp\/product|gp\/aw\/d)\/([A-Z0-9]{10,13})/i);
   if(m)codes.push(m[1].toUpperCase());
  }catch(e){}
 }
 const unique=[...new Set(codes)];
 for(const code of unique){
  try{
   const response=await fetch("https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent("isbn:"+code)+"&maxResults=10");
   if(!response.ok)continue;
   const data=await response.json();
   const item=(data.items||[]).find(x=>x.volumeInfo?.description);
   if(item){output.textContent=item.volumeInfo.description;return;}
  }catch(e){}
 }
 output.textContent="Panoramica non disponibile.";
}
loadPanoramica();
</script>
</body>
</html>
